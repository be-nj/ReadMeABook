# CI + CD for the multi-library fork (be-nj/ReadMeABook).
# Documentation: documentation/deployment/fork-ci.md
#
# Every push to the fork's working branch: full test suite, then the unified
# image is built and pushed to ghcr.io as
#   ghcr.io/be-nj/readmeabook:multilib      (moving tag, what the homelab runs)
#   ghcr.io/be-nj/readmeabook:sha-<short>   (pinned, for rollbacks)
# Deploying is a separate, manual step: Komodo DeployStack for the readmeabook
# service in the homelab Komodo stack pulls :multilib (auto_pull). GitHub
# runners cannot reach Komodo (LAN-only), so there is no deploy step here.
#
# The upstream tag workflow (build-unified-image.yml, v* tags) stays untouched.

name: Build multilib image

on:
  push:
    branches:
      - feat/multi-library-owned
  workflow_dispatch:

# Two pushes in quick succession would race for the :multilib tag; queue them.
concurrency:
  group: deploy-multilib
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: be-nj/readmeabook

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/run-tests.yml
    with:
      send_notification: false

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture version information
        id: version
        run: |
          echo "app_version=$(node -p "require('./package.json').version")-multilib" >> $GITHUB_OUTPUT
          echo "git_commit=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      # amd64 only: the homelab host is x86_64 and a single platform halves the
      # build time compared with the tag workflow's multi-arch build.
      - name: Build and push unified Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile.unified
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:multilib
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.version.outputs.git_commit }}
          labels: |
            org.opencontainers.image.title=ReadMeABook Unified (multilib fork)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}

      - name: Summary
        run: |
          echo "Pushed ${REGISTRY}/${IMAGE_NAME}:multilib and :sha-${{ steps.version.outputs.git_commit }}" >> $GITHUB_STEP_SUMMARY
          echo "Deploy: Komodo DeployStack of the readmeabook service (see documentation/deployment/fork-ci.md)." >> $GITHUB_STEP_SUMMARY
